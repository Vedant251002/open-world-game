name = "delegate-ai"
main = "worker.js"
compatibility_date = "2026-01-01"

# The key is NOT here and must never be. It is set once, straight into
# Cloudflare, and this file is committed:
#
#   npx wrangler secret put OPENCODE_API_KEY
#
# OPENCODE_MODEL is not a secret, so it can live in the open. Change it here
# and redeploy to move the whole game onto another model.
[vars]
OPENCODE_MODEL = "nemotron-3-ultra-free"
